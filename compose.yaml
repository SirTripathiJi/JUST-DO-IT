services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: justdoit
      POSTGRES_USER: justdoit
      POSTGRES_PASSWORD: justdoit
    ports:
      - "5432:5432"
    volumes:
      - justdoit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justdoit -d justdoit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  justdoit-postgres:
